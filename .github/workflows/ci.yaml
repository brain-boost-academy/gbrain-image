name: CI

concurrency:
  group: ci-mutex
  cancel-in-progress: false

on:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6
      - id: setup-buildx
        name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - id: login
        name: Login to docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build-push
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/gbrain:latest
            ghcr.io/${{ github.repository }}/gbrain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
