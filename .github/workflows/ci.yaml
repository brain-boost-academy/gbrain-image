name: CI

concurrency:
  group: ci-mutex
  cancel-in-progress: false

on:
  schedule:
    # Avoid minute 0: top-of-hour is GitHub's most oversubscribed slot and
    # scheduled runs there are frequently delayed or dropped. An odd minute
    # is far more reliable. GitHub still does not guarantee punctuality.
    - cron: "37 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "gbrain tag/sha to build (empty = master; non-master builds don't move :latest)"
        required: false
        default: ""
      bun_version:
        description: "oven/bun base image version (gbrain >= 0.60.27.0 needs 1.4+)"
        required: false
        default: "1.4.3"
      tag_suffix:
        description: "appended to the version tag (e.g. -bun1.4.3) so a rebuild doesn't overwrite an existing tag"
        required: false
        default: ""

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GBRAIN_REPO: garrytan/gbrain
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6

      - id: resolve
        name: Resolve gbrain version and SHA
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Pin to the exact master commit and read package.json AT that commit,
          # so the version tag and the build come from the same source (no race).
          ref="${INPUT_REF:-master}"
          sha=$(gh api "repos/${GBRAIN_REPO}/commits/${ref}" --jq .sha)
          version=$(gh api "repos/${GBRAIN_REPO}/contents/package.json?ref=${sha}" \
                      -H "Accept: application/vnd.github.raw" --jq .version)
          # Fail-safe: refuse to publish a garbage/empty label. Accept 3- or 4-part
          # versions so a future upstream switch back to 3-part semver doesn't hard-fail.
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+){2,3}$' \
            || { echo "bad version: '$version'" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$ref" = "master" ]; then
            echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved gbrain $version @ $sha"

      - id: login
        name: Login to docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        name: Check if version already published
        if: github.event_name == 'schedule'
        run: |
          # Dedup probe — only on schedule (push/manual always rebuild). Distinguish
          # "tag/repo not found" (build it) from any other registry error (fail loudly)
          # so a transient glitch can't masquerade as "not published". "name unknown"
          # covers the first run, when the package repo doesn't exist yet.
          if out=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.resolve.outputs.version }}" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.resolve.outputs.version }} already published."
          elif printf '%s' "$out" | grep -qiE 'not found|manifest unknown|name unknown|not present'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.resolve.outputs.version }} not published yet — will build."
          else
            echo "dedup probe failed (not a 404): $out" >&2
            exit 1
          fi

      - id: setup-buildx
        name: Setup Docker Buildx
        if: steps.exists.outputs.exists == 'false' || github.event_name != 'schedule'
        uses: docker/setup-buildx-action@v4

      - id: build-push
        name: Build and push
        if: steps.exists.outputs.exists == 'false' || github.event_name != 'schedule'
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            GBRAIN_REF=${{ steps.resolve.outputs.sha }}
            BUN_VERSION=${{ inputs.bun_version || '1.4.3' }}
          tags: |
            ${{ steps.resolve.outputs.latest_tag }}
            ${{ env.IMAGE }}:${{ steps.resolve.outputs.version }}${{ inputs.tag_suffix }}
